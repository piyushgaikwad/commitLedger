<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>commitLedger Dashboard</title>
  <style>
    :root{
      /* darker + blackish */
      --bg0:#05070a;
      --bg1:#070a0f;
      --bg2:#0a0f16;

      --glass: rgba(255,255,255,.04);
      --glass2: rgba(255,255,255,.03);
      --stroke: rgba(255,255,255,.08);
      --stroke2: rgba(255,255,255,.06);

      --text:#d7dee8;
      --muted:#97a7bb;
      --muted2:#6f8299;

      --green:#22c55e;
      --red:#ef4444;
      --amber:#f59e0b;

      --shadow: 0 30px 90px rgba(0,0,0,.75);
      --r1: 22px;
      --r2: 18px;
    }

    *{ box-sizing:border-box; }

    html, body{
      height: 100%;
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 35% -10%, rgba(110,140,200,.14), transparent 55%),
        radial-gradient(900px 600px at 70% -15%, rgba(160,120,220,.10), transparent 60%),
        radial-gradient(1200px 900px at 50% 110%, rgba(0,0,0,.65), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 55%, var(--bg2));
      overflow: hidden;
    }

    /* subtle vignette */
    body::before{
      content:"";
      position:fixed; inset:0;
      background:
        radial-gradient(1200px 900px at 50% 45%, transparent 45%, rgba(0,0,0,.65) 78%, rgba(0,0,0,.9) 100%);
      pointer-events:none;
      mix-blend-mode: multiply;
    }

    .shell{
      height: 100%;
      padding: 22px;
      display:flex;
    }

    .app{
      width: 100%;
      height: 100%;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }

    .app::after{
      content:"";
      position:absolute; inset:0;
      border-radius: 28px;
      pointer-events:none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
    }

    .topbar{
      height: 0px;
      padding: 0px;
      display:none;
    }

    .main{
      height: 100%;
      display:grid;
      grid-template-columns: 78px 1fr;
    }

    .sidebar{
      padding: 0;
      border-right: none;
      background: transparent;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 12px;
    }
    .nav{
      width:48px; height:48px;
      border-radius: 18px;
      display:grid;
      place-items:center;
      border: 1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.02);
      color: var(--muted);
      cursor:pointer;
    }
    .nav.active{
      border-color: rgba(124,92,255,.35);
      background: rgba(124,92,255,.10);
      color: #e6e1ff;
    }
    .nav:hover{ background: rgba(255,255,255,.04); color: var(--text); }

    .content{
      padding: 20px;
      background: linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.16));
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.12) transparent;
    }
    .content::-webkit-scrollbar{ width: 10px; }
    .content::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,.10);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    .hero{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
      margin-bottom: 20px;
    }
    .h1{
      font-size:28px;
      font-weight:650;
      letter-spacing:-.02em;
      color: var(--text);
    }
    .h1 span{
      color: var(--muted);
    }
    .subtitle{
      margin-top:6px;
      font-size:12px;
      color: var(--muted);
    }

    .grid-4{
      display:grid;
      gap:12px;
      grid-template-columns: repeat(4, 1fr);
      margin-bottom: 16px;
      align-items: start;
    }
    @media (max-width: 1000px){
      .grid-4{grid-template-columns: repeat(2, 1fr)}
      .hero{flex-direction:column; align-items:flex-start}
    }
    @media (max-width: 560px){
      .grid-4{grid-template-columns: 1fr}
    }

    .card{
      background: var(--glass);
      border:1px solid var(--stroke);
      border-radius: 14px;
      box-shadow: 0 0 0 1px rgba(255,255,255,.06);
    }
    .card-inner{
      padding: 12px 14px;
    }
    .kicker{
      font-size:10px;
      letter-spacing:.22em;
      text-transform:uppercase;
      color: rgba(255,255,255,.60);
    }
    .big{
      margin-top:8px;
      font-size:28px;
      font-weight:650;
      color: var(--text);
    }
    .small{
      margin-top:4px;
      font-size:11px;
      color: var(--muted);
    }

    .section-header{
      margin-bottom: 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 12px 16px;
      background: var(--glass);
      border:1px solid var(--stroke);
      border-radius: 14px;
      box-shadow: 0 0 0 1px rgba(255,255,255,.06);
    }
    .section-header .left{
      display:flex;
      align-items:center;
      gap: 12px;
    }
    .section-title{
      font-size:11px;
      letter-spacing:.22em;
      text-transform:uppercase;
      color: rgba(255,255,255,.60);
    }
    .repo-info{
      font-size:13px;
      color: var(--text);
      font-weight: 600;
    }
    .repo-info .sep{
      color: var(--muted2);
      margin: 0 8px;
    }
    .branch-info{
      display:flex;
      align-items:center;
      gap: 6px;
      font-size:13px;
      color: var(--text);
      font-weight: 600;
    }
    .branch-info svg{
      width: 12px;
      height: 12px;
      opacity: .7;
      margin-right: 2px;
    }

    .list-section{
      margin-top: 0px;
    }
    .list{
      height: auto;
      min-height: 300px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.07);
      background: rgba(255,255,255,.02);
      overflow:auto;
    }

    .row{
      display:flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      padding: 14px 16px;
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .row:first-child{ border-top:none; }
    .row:hover{ background: rgba(255,255,255,.03); }

    .row > div:first-child{
      flex: 1;
      min-width: 0;
    }

    .title{
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .meta{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
    }
    .dot{ opacity:.6; }

    .hash{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.09);
      color: var(--muted);
      font-size: 10px;
    }
    .hash svg{
      width: 12px;
      height: 12px;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .chip.claude-code{
      background: rgba(255,138,61,.10);
      border: 1px solid rgba(255,138,61,.28);
      color: #ffb380;
    }
    .chip.cursor{
      background: rgba(59,130,246,.10);
      border: 1px solid rgba(59,130,246,.28);
      color: #60a5fa;
    }
    .chip.human{
      background: rgba(165,206,0,.10);
      border: 1px solid rgba(165,206,0,.28);
      color: #A5CE00;
    }
    .chip .b{
      width:6px;height:6px;border-radius:999px;
    }
    .chip.claude-code .b{ background: rgba(255,138,61,.95); }
    .chip.cursor .b{ background: rgba(59,130,246,.95); }
    .chip.human .b{ background: rgba(165,206,0,.95); }

    .rstats{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      justify-content:flex-start;
      gap: 6px;
      flex-shrink: 0;
    }
    .diff{
      display:flex;
      gap: 10px;
      align-items:center;
      font-size: 11px;
      color: var(--muted);
    }
    .plus{ color: var(--green); font-weight: 700; }
    .minus{ color: var(--red); font-weight: 700; }
    .files{ color: var(--muted); }

    .sub{
      font-size: 12px;
      color: var(--muted);
      display:flex;
      gap: 10px;
      align-items:center;
    }
    .sep{ opacity:.5; }

    .view-chat-btn{
      display:inline-flex;
      align-items:center;
      gap: 5px;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 500;
      color: #60a5fa;
      background: rgba(59,130,246,.10);
      border: 1px solid rgba(59,130,246,.25);
      cursor:pointer;
      transition: all 0.2s ease;
      margin-top: 6px;
    }
    .view-chat-btn:hover{
      background: rgba(59,130,246,.15);
      border-color: rgba(59,130,246,.35);
    }
    .view-chat-btn svg{
      width: 11px;
      height: 11px;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg1);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    }

    .modal-header h3 {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.5rem;
      line-height: 1;
      padding: 4px 8px;
      transition: color 0.2s ease;
    }

    .modal-close:hover {
      color: var(--text);
    }

    .modal-body {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-body::-webkit-scrollbar {
      width: 10px;
    }

    .modal-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .modal-body::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.10);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    .message {
      background: rgba(0,0,0,.20);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .message-role {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .message-role.user {
      color: #60a5fa;
    }

    .message-role.assistant {
      color: #a78bfa;
    }

    .message-time {
      font-size: 0.75rem;
      color: var(--muted2);
      font-family: 'SF Mono', Monaco, monospace;
    }

    .message-content {
      color: var(--text);
      font-size: 0.875rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message-meta {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,.06);
      font-size: 0.75rem;
      color: var(--muted);
    }

    .message-meta-item {
      margin-top: 4px;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 40px;
      font-size: 0.875rem;
    }

    .error {
      text-align: center;
      color: var(--red);
      padding: 40px;
      font-size: 0.875rem;
    }

    @media (max-width: 900px){
      .shell{ padding: 12px; }
      .row{ flex-direction: column; }
      .rstats{ align-items:flex-start; }
      .main{ grid-template-columns: 68px 1fr; }
    }
  </style>
</head>

          "content": "Perfect! I've updated the code to extract and display token usage from Claude Code sessions. Here's what I did:\n\n## Changes Made:\n\n1. **Updated Chat Summary Schema** - Added `TokenUsageSchema` to track:\n   - `input_tokens`\n   - `output_tokens`\n   - `cache_creation_input_tokens`\n   - `cache_read_input_tokens`\n   - `total_tokens`\n\n2. **Updated Chat Summary Generator** - Now extracts token usage from JSONL events and sums them up across the entire session\n\n3. **Updated Dashboard** - Now reads token data from chat summaries: `chatSummary?.chat_data?.token_usage?.total_tokens`\n\n## Important Note:\n\n**Existing chat summaries don't have token data yet.** To see token information for your commits, you'll need to regenerate the chat summaries by running:\n\n```bash\nnode dist/index.mjs store\n```\n\nThis will re-process recent sessions and store the chat summaries with token usage data. After that, when you run:\n\n```bash\nnode dist/index.mjs dashboard -b main -l 50\n```\n\nYou should see actual token counts instead of \"N/A\" for commits with AI sessions! 🎉\n\nWould you like me to run the store command now to regenerate the summaries?",

          "timestamp": "2026-03-01T21:56:02.613Z",
          "content": "Based on my exploration, here's where token usage data is stored and accessed:\n\n## Token Data Flow\n\n**1. Original Source:** Token usage is in Claude Code's JSONL session files\n- Location: `~/.claude/projects/<project-hash>/<session-id>.jsonl`\n- Each event line contains a `usage` field with token counts\n\n**2. Storage in Metadata Branch (Local Artifacts):**\nYes, token data IS stored locally in the git metadata branch after processing:\n- **Location:** `ai/checkpoints/v1` branch\n- **File:** `chat-summaries/<commit-sha>.json`\n- Contains the aggregated token usage for that commit's session\n\n**3. Commands:**\n\n- **`capture` command** (or post-commit hook): Processes sessions and stores chat summaries WITH token data in the metadata branch\n- **`dashboard` command**: Reads the stored chat summaries from metadata branch and displays tokens\n\n## Current Status\n\nSince I just added token extraction to the code:\n- **Existing chat summaries** don't have token data (they were created before this change)\n- **New chat summaries** will include token data when generated\n\n## To See Token Data in Dashboard:\n\nYou need to regenerate the chat summaries. You can do this by running:\n\n```bash\n# Option 1: Re-capture recent commits (last 24 hours by default)\nnode dist/index.mjs capture\n\n# Option 2: Check what the store command does\nnode dist/index.mjs store\n```\n\nLet me check what the `store` command does to see if that's the right one to use:",

          "timestamp": "2026-03-01T21:56:20.548Z",
          "content": "Perfect! Here's the complete answer:\n\n## Where Token Data Is Stored\n\n**Yes, it's stored in local artifacts:**\n\n📍 **Storage Location:** Git metadata branch `ai/checkpoints/v1`  \n📁 **File Path:** `chat-summaries/<commit-sha>.json`  \n💾 **Format:** JSON file containing chat summary with `token_usage` field\n\n## Commands\n\nThere is NO separate \"store\" command. The **`capture` command** does everything:\n\n```bash\n# Capture a specific commit (processes session, stores receipt + chat summary)\nnode dist/index.mjs capture <commit-sha>\n\n# Capture the most recent commit\nnode dist/index.mjs capture\n```\n\n## Your Current Situation\n\nSince I just added token extraction to the code:\n\n✅ **Code is ready** - Token extraction is implemented  \n❌ **Old chat summaries** - Don't have token data (created before this change)  \n✅ **New captures** - Will include token data going forward\n\n## To See Tokens in Dashboard\n\nYou need to **re-capture commits** to regenerate their chat summaries with token data:\n\n```bash\n# Re-capture recent commits one by one\nnode dist/index.mjs capture ef20282  # Your dashboard commit\nnode dist/index.mjs capture 2180c90  # Your UI commit\n# etc...\n\n# Then regenerate dashboard\nnode dist/index.mjs dashboard -b main -l 50\n```\n\n**Question:** Would you like me to create a plan for adding a bulk re-capture feature (like `capture --all` or `capture --last <N>`) so you don't have to manually re-capture each commit? Or should we just re-capture the recent commits manually?",

          "timestamp": "2026-03-01T21:50:47.342Z",
          "content": "Perfect! I've updated the code to extract and display token usage from Claude Code sessions. Here's what I did:\n\n## Changes Made:\n\n1. **Updated Chat Summary Schema** - Added `TokenUsageSchema` to track:\n   - `input_tokens`\n   - `output_tokens`\n   - `cache_creation_input_tokens`\n   - `cache_read_input_tokens`\n   - `total_tokens`\n\n2. **Updated Chat Summary Generator** - Now extracts token usage from JSONL events and sums them up across the entire session\n\n3. **Updated Dashboard** - Now reads token data from chat summaries: `chatSummary?.chat_data?.token_usage?.total_tokens`\n\n## Important Note:\n\n**Existing chat summaries don't have token data yet.** To see token information for your commits, you'll need to regenerate the chat summaries by running:\n\n```bash\nnode dist/index.mjs store\n```\n\nThis will re-process recent sessions and store the chat summaries with token usage data. After that, when you run:\n\n```bash\nnode dist/index.mjs dashboard -b main -l 50\n```\n\nYou should see actual token counts instead of \"N/A\" for commits with AI sessions! 🎉\n\nWould you like me to run the store command now to regenerate the summaries?",

        {
          "timestamp": "2026-03-01T21:56:02.613Z",
          "content": "Based on my exploration, here's where token usage data is stored and accessed:\n\n## Token Data Flow\n\n**1. Original Source:** Token usage is in Claude Code's JSONL session files\n- Location: `~/.claude/projects/<project-hash>/<session-id>.jsonl`\n- Each event line contains a `usage` field with token counts\n\n**2. Storage in Metadata Branch (Local Artifacts):**\nYes, token data IS stored locally in the git metadata branch after processing:\n- **Location:** `ai/checkpoints/v1` branch\n- **File:** `chat-summaries/<commit-sha>.json`\n- Contains the aggregated token usage for that commit's session\n\n**3. Commands:**\n\n- **`capture` command** (or post-commit hook): Processes sessions and stores chat summaries WITH token data in the metadata branch\n- **`dashboard` command**: Reads the stored chat summaries from metadata branch and displays tokens\n\n## Current Status\n\nSince I just added token extraction to the code:\n- **Existing chat summaries** don't have token data (they were created before this change)\n- **New chat summaries** will include token data when generated\n\n## To See Token Data in Dashboard:\n\nYou need to regenerate the chat summaries. You can do this by running:\n\n```bash\n# Option 1: Re-capture recent commits (last 24 hours by default)\nnode dist/index.mjs capture\n\n# Option 2: Check what the store command does\nnode dist/index.mjs store\n```\n\nLet me check what the `store` command does to see if that's the right one to use:",

          "timestamp": "2026-03-01T21:56:20.548Z",
          "content": "Perfect! Here's the complete answer:\n\n## Where Token Data Is Stored\n\n**Yes, it's stored in local artifacts:**\n\n📍 **Storage Location:** Git metadata branch `ai/checkpoints/v1`  \n📁 **File Path:** `chat-summaries/<commit-sha>.json`  \n💾 **Format:** JSON file containing chat summary with `token_usage` field\n\n## Commands\n\nThere is NO separate \"store\" command. The **`capture` command** does everything:\n\n```bash\n# Capture a specific commit (processes session, stores receipt + chat summary)\nnode dist/index.mjs capture <commit-sha>\n\n# Capture the most recent commit\nnode dist/index.mjs capture\n```\n\n## Your Current Situation\n\nSince I just added token extraction to the code:\n\n✅ **Code is ready** - Token extraction is implemented  \n❌ **Old chat summaries** - Don't have token data (created before this change)  \n✅ **New captures** - Will include token data going forward\n\n## To See Tokens in Dashboard\n\nYou need to **re-capture commits** to regenerate their chat summaries with token data:\n\n```bash\n# Re-capture recent commits one by one\nnode dist/index.mjs capture ef20282  # Your dashboard commit\nnode dist/index.mjs capture 2180c90  # Your UI commit\n# etc...\n\n# Then regenerate dashboard\nnode dist/index.mjs dashboard -b main -l 50\n```\n\n**Question:** Would you like me to create a plan for adding a bulk re-capture feature (like `capture --all` or `capture --last <N>`) so you don't have to manually re-capture each commit? Or should we just re-capture the recent commits manually?",

        {
          "timestamp": "2026-03-01T22:06:33.274Z",
          "content": "## ✅ Fixed! Token Data Now Working\n\nI found and fixed the issue! The problem was that **token usage data is nested inside `event.message.usage`**, not at the top level `event.usage`.\n\n### What I Fixed:\n\n1. **Changed token extraction logic** in [chat-summary-generator.ts:53-68](src/receipt/chat-summary-generator.ts#L53-L68):\n   ```typescript\n   // FROM: event.usage\n   const usage = event.message?.usage;\n   // TO: event.message.usage (correct location)\n   ```\n\n2. **Added comprehensive logging** to debug future issues\n3. **Added schema validation** to catch data quality issues early\n4. **Added token count to success message** for visibility\n\n### Results:\n\n✅ **Token extraction working**: 26.4M tokens extracted from the session  \n✅ **Data stored correctly**: Verified in metadata branch  \n✅ **Dashboard updated**: Regenerated and should now show \"26.4M tokens\" instead of \"N/A\"\n\n### To See Tokens in Dashboard:\n\nThe current commit now shows tokens! For other commits, you can re-capture them:\n\n```bash\n# Re-capture any commit\nnode dist/index.mjs capture <commit-sha>\n\n# Or re-capture recent commits one by one\nnode dist/index.mjs capture ef20282\nnode dist/index.mjs capture 2180c90\n# etc...\n\n# Then regenerate dashboard\nnode dist/index.mjs dashboard -b main -l 50\n```\n\nThe dashboard is already open in your browser showing the latest data! 🎉",
          "truncated": false

          "truncated": false
        },
        {
          "timestamp": "2026-03-01T22:12:13.699Z",
          "content": "You're right to question this! The token count is misleadingly high because we're adding **all token types together**, including cache tokens which are counted differently.\n\nLet me check what's actually being counted:",

        {
          "timestamp": "2026-03-01T22:12:26.144Z",
          "content": "I see the issue! We're incorrectly summing **all token types** together:\n\n```\nInput: 3,093\nOutput: 63,532  \nCache Create: 3,428,813\nCache Read: 22,912,746\n---\nTotal: 26,408,184 (26.4M tokens)\n```\n\nThis is wrong because:\n\n1. **Cache read tokens are not \"regular\" tokens** - they're cached context reused from previous API calls (much cheaper, ~10% cost)\n2. **Cache creation tokens** represent tokens used to build the cache\n3. We shouldn't add them all together as \"total tokens\"\n\nThe **actual meaningful token count** should be just:\n- **Input + Output = 3,093 + 63,532 = 66,625 tokens (66.6k)**\n\nLet me fix the total calculation to show only actual consumed tokens:",

          "content": "## Fixed! Token Count Now Accurate\n\nYou were absolutely right to question that number. The issue was that I was **incorrectly adding all token types together**, including cache metrics.\n\n### What Was Wrong:\n\n**Before:**\n```\nInput: 3,093\nOutput: 63,532  \nCache Create: 3,428,813  ← Should NOT be in total\nCache Read: 22,912,746   ← Should NOT be in total\n---\nTotal: 26,408,184 (26.4M) ❌ WRONG\n```\n\n### What's Fixed:\n\n**Now:**\n```\nInput: 3,342\nOutput: 67,209\n---\nTotal: 70,551 (70.6k) ✅ CORRECT\n```\n\nCache tokens are still tracked separately:\n- `cache_creation_input_tokens`: 3.8M (tokens used to build cache)\n- `cache_read_input_tokens`: 25.2M (tokens read from cache - much cheaper!)\n\n### Why This Makes Sense:\n\n- **Actual consumed tokens**: 70.6k (what you're billed for at full rate)\n- **Cache reads**: 25.2M tokens (but at ~10% cost, so effectively ~2.5M equivalent tokens)\n- **Total session**: A long conversation with heavy prompt caching to reduce costs\n\nThe dashboard now shows **70.6k tokens** which is the actual consumed token count. Much more reasonable! 🎉",

          "timestamp": "2026-03-01T22:06:33.274Z",
          "content": "## ✅ Fixed! Token Data Now Working\n\nI found and fixed the issue! The problem was that **token usage data is nested inside `event.message.usage`**, not at the top level `event.usage`.\n\n### What I Fixed:\n\n1. **Changed token extraction logic** in [chat-summary-generator.ts:53-68](src/receipt/chat-summary-generator.ts#L53-L68):\n   ```typescript\n   // FROM: event.usage\n   const usage = event.message?.usage;\n   // TO: event.message.usage (correct location)\n   ```\n\n2. **Added comprehensive logging** to debug future issues\n3. **Added schema validation** to catch data quality issues early\n4. **Added token count to success message** for visibility\n\n### Results:\n\n✅ **Token extraction working**: 26.4M tokens extracted from the session  \n✅ **Data stored correctly**: Verified in metadata branch  \n✅ **Dashboard updated**: Regenerated and should now show \"26.4M tokens\" instead of \"N/A\"\n\n### To See Tokens in Dashboard:\n\nThe current commit now shows tokens! For other commits, you can re-capture them:\n\n```bash\n# Re-capture any commit\nnode dist/index.mjs capture <commit-sha>\n\n# Or re-capture recent commits one by one\nnode dist/index.mjs capture ef20282\nnode dist/index.mjs capture 2180c90\n# etc...\n\n# Then regenerate dashboard\nnode dist/index.mjs dashboard -b main -l 50\n```\n\nThe dashboard is already open in your browser showing the latest data! 🎉",

          "timestamp": "2026-03-01T22:12:13.699Z",
          "content": "You're right to question this! The token count is misleadingly high because we're adding **all token types together**, including cache tokens which are counted differently.\n\nLet me check what's actually being counted:",

        {
          "timestamp": "2026-03-01T22:12:26.144Z",
          "content": "I see the issue! We're incorrectly summing **all token types** together:\n\n```\nInput: 3,093\nOutput: 63,532  \nCache Create: 3,428,813\nCache Read: 22,912,746\n---\nTotal: 26,408,184 (26.4M tokens)\n```\n\nThis is wrong because:\n\n1. **Cache read tokens are not \"regular\" tokens** - they're cached context reused from previous API calls (much cheaper, ~10% cost)\n2. **Cache creation tokens** represent tokens used to build the cache\n3. We shouldn't add them all together as \"total tokens\"\n\nThe **actual meaningful token count** should be just:\n- **Input + Output = 3,093 + 63,532 = 66,625 tokens (66.6k)**\n\nLet me fix the total calculation to show only actual consumed tokens:",

          "timestamp": "2026-03-01T10:56:28.102Z",
          "content": "Perfect! I've successfully implemented AI chat summary storage for commitLedger. Here's what has been added:\n\n## 🎉 New Features\n\n### 1. **Chat Summary Schema** ([src/receipt/chat-summary-schema.ts](src/receipt/chat-summary-schema.ts))\n- Defines the structure for storing AI chat conversations\n- Captures user prompts and assistant responses\n- Includes metadata like timestamps, tool uses, and modified files\n- Content is truncated to 10,000 characters max (with truncation flag)\n- SHA-256 integrity hash for tamper detection\n\n### 2. **Chat Summary Generator** ([src/receipt/chat-summary-generator.ts](src/receipt/chat-summary-generator.ts))\n- Extracts prompts and responses from Claude Code sessions\n- Parses JSONL session files\n- Tracks tool usage (Read, Write, Edit, etc.)\n- Records which files were modified in each response\n- Extensible for Cursor support\n\n### 3. **Storage in Metadata Branch** ([src/git/metadata-branch.ts](src/git/metadata-branch.ts))\n- Added `chat-summaries/` directory alongside `checkpoints/`\n- Chat summaries stored as `chat-summaries/<commit-sha>.json`\n- Methods added:\n  - `storeChatSummary()` - Store chat summary for a commit\n  - `retrieveChatSummary()` - Retrieve chat summary by commit SHA\n  - `chatSummaryExists()` - Check if summary exists\n\n### 4. **Enhanced Capture Command** ([src/cli/commands/capture.ts](src/cli/commands/capture.ts))\n- Automatically generates and stores chat summaries when AI is detected\n- Shows message count: `Chat summary captured (12 messages)`\n- Gracefully handles errors without failing the capture\n\n### 5. **New `show-chat` Command** ([src/cli/commands/show-chat.ts](src/cli/commands/show-chat.ts))\n- Beautiful formatted display of chat conversations\n- Shows user prompts and assistant responses with timestamps\n- Displays tool usage and files modified\n- Supports `--json` flag for programmatic access\n\n## 📝 Usage Examples\n\n### Capture a commit with chat summary:\n```bash\ncommitledger capture HEAD\n# ✓ Receipt captured for abc1234\n# ✓ Chat summary captured (15 messages)\n```\n\n### View the chat summary:\n```bash\ncommitledger show-chat HEAD\n\n# ═════════════════════════════════════════════════\n#          AI CHAT SUMMARY\n# ═════════════════════════════════════════════════\n#\n# 📋 Commit Information\n#   SHA:        abc1234...\n#   Session ID: session-xyz\n#   Agent:      claude-code\n#\n# 📊 Chat Statistics\n#   Total Messages:      15\n#   User Prompts:        8\n#   Assistant Responses: 7\n#\n# 💬 User Prompts\n#   [1] 2/27/2026, 10:30:00 AM\n#   ------------------------------------------------\n#   Add user authentication to the application\n#\n# 🤖 Assistant Responses\n#   [1] 2/27/2026, 10:31:00 AM\n#   ------------------------------------------------\n#   Tools used: Write, Edit\n#   Files modified: 3\n#     • src/auth.ts\n#     • src/login.ts\n#     • tests/auth.test.ts\n#\n#   I'll help you add user authentication...\n```\n\n### Get JSON output:\n```bash\ncommitledger show-chat abc1234 --json\n```\n\n## 🗂️ Metadata Branch Structure\n\n```\nai/checkpoints/v1/\n├── README.md\n├── checkpoints/          # AI receipts\n│   ├── abc1234...json\n│   └── def5678...json\n└── chat-summaries/       # NEW: Chat summaries\n    ├── abc1234...json\n    └── def5678...json\n```\n\n## 🔍 Chat Summary Format\n\nEach `chat-summaries/<sha>.json` contains:\n\n```json\n{\n  \"version\": \"1.0\",\n  \"commit_sha\": \"abc1234...\",\n  \"session_id\": \"session-xyz\",\n  \"agent_type\": \"claude-code\",\n  \"chat_data\": {\n    \"total_messages\": 15,\n    \"user_prompts\": [\n      {\n        \"timestamp\": \"2026-02-27T10:30:00.000Z\",\n        \"content\": \"Add user authentication\",\n        \"truncated\": false\n      }\n    ],\n    \"assistant_responses\": [\n      {\n        \"timestamp\": \"2026-02-27T10:31:00.000Z\",\n        \"content\": \"I'll help you add authentication...\",\n        \"truncated\": false,\n        \"tool_uses\": [\"Write\", \"Edit\"],\n        \"files_modified\": [\"src/auth.ts\", \"src/login.ts\"]\n      }\n    ]\n  },\n  \"integrity_hash\": \"44d9fc020beac938...\",\n  \"generated_at\": \"2026-02-27T10:32:00.000Z\"\n}\n```\n\n## ✅ Build Status\n\nThe project has been successfully built with all the new features! 🎉\n\nAll chat summaries are stored locally, maintaining commitLedger's local-first philosophy. No data is sent to the cloud.",

          "timestamp": "2026-03-01T11:17:39.530Z",
          "content": "Perfect! I've successfully created a web dashboard for visualizing your commits. Here's what I built:\n\n## 🎨 Features Implemented\n\n### 1. **Dark Theme Dashboard**\n- Beautiful gradient dark background (deep navy blue)\n- Modern glassmorphism design with backdrop blur effects\n- Smooth animations and hover effects\n- Fully responsive layout\n\n### 2. **Repository Commits View**\nEach commit card displays:\n- **Commit SHA** (full hash in monospace font)\n- **GitHub Author** (with user icon)\n- **Timestamp** (localized date/time)\n- **Commit Message** (prominent display)\n- **AI Agent Badge** (Claude Code, Cursor, or Human)\n  - Purple gradient for Claude Code\n  - Blue for Cursor\n  - Gray for Human\n- **Confidence Score** (for AI-detected commits)\n- **Statistics**: Files changed, additions, deletions\n\n### 3. **Dashboard Statistics**\nAt the top, you get overview cards showing:\n- Total Commits\n- AI-Assisted Commits\n- Human-Authored Commits\n- Claude Code Commits\n- Cursor Commits\n\n### 4. **Branch View**\n- Filter by specific branch with `-b` flag\n- Shows current branch by default\n- Displays branch name in the header\n\n## 📝 Usage\n\n### Generate dashboard for current branch:\n```bash\ncommitledger dashboard\n```\n\n### Generate for specific branch:\n```bash\ncommitledger dashboard -b main\n```\n\n### Limit number of commits:\n```bash\ncommitledger dashboard -l 100\n```\n\n### Custom output file:\n```bash\ncommitledger dashboard -o my-dashboard.html\n```\n\n### Generate without auto-opening:\n```bash\ncommitledger dashboard --no-open\n```\n\n## 🎯 Visual Features\n\n- **AI-Assisted Commits**: Have a colorful gradient left border\n- **Color Coding**:\n  - Blue gradients for links and primary actions\n  - Purple for Claude Code\n  - Blue for Cursor  \n  - Green for additions (+)\n  - Red for deletions (-)\n- **Hover Effects**: Cards lift up on hover with enhanced shadows\n- **Icons**: Beautiful SVG icons for users, calendars, and AI\n\nT           "timestamp": "2026-03-01T10:56:28.102Z",
          "content": "Perfect! I've successfully implemented AI chat summary storage for commitLedger. Here's what has been added:\n\n## 🎉 New Features\n\n### 1. **Chat Summary Schema** ([src/receipt/chat-summary-schema.ts](src/receipt/chat-summary-schema.ts))\n- Defines the structure for storing AI chat conversations\n- Captures user prompts and assistant responses\n- Includes metadata like timestamps, tool uses, and modified files\n- Content is truncated to 10,000 characters max (with truncation flag)\n- SHA-256 integrity hash for tamper detection\n\n### 2. **Chat Summary Generator** ([src/receipt/chat-summary-generator.ts](src/receipt/chat-summary-generator.ts))\n- Extracts prompts and responses from Claude Code sessions\n- Parses JSONL session files\n- Tracks tool usage (Read, Write, Edit, etc.)\n- Records which files were modified in each response\n- Extensible for Cursor support\n\n### 3. **Storage in Metadata Branch** ([src/git/metadata-branch.ts](src/git/metadata-branch.ts))\n- Added `chat-summaries/` directory alongside `checkpoints/`\n- Chat summaries stored as `chat-summaries/<commit-sha>.json`\n- Methods added:\n  - `storeChatSummary()` - Store chat summary for a commit\n  - `retrieveChatSummary()` - Retrieve chat summary by commit SHA\n  - `chatSummaryExists()` - Check if summary exists\n\n### 4. **Enhanced Capture Command** ([src/cli/commands/capture.ts](src/cli/commands/capture.ts))\n- Automatically generates and stores chat summaries when AI is detected\n- Shows message count: `Chat summary captured (12 messages)`\n- Gracefully handles errors without failing the capture\n\n### 5. **New `show-chat` Command** ([src/cli/commands/show-chat.ts](src/cli/commands/show-chat.ts))\n- Beautiful formatted display of chat conversations\n- Shows user prompts and assistant responses with timestamps\n- Displays tool usage and files modified\n- Supports `--json` flag for programmatic access\n\n## 📝 Usage Examples\n\n### Capture a commit with chat summary:\n```bash\ncommitledger capture HEAD\n# ✓ Receipt captured for abc1234\n# ✓ Chat summary captured (15 messages)\n```\n\n### View the chat summary:\n```bash\ncommitledger show-chat HEAD\n\n# ═════════════════════════════════════════════════\n#          AI CHAT SUMMARY\n# ═════════════════════════════════════════════════\n#\n# 📋 Commit Information\n#   SHA:        abc1234...\n#   Session ID: session-xyz\n#   Agent:      claude-code\n#\n# 📊 Chat Statistics\n#   Total Messages:      15\n#   User Prompts:        8\n#   Assistant Responses: 7\n#\n# 💬 User Prompts\n#   [1] 2/27/2026, 10:30:00 AM\n#   ------------------------------------------------\n#   Add user authentication to the application\n#\n# 🤖 Assistant Responses\n#   [1] 2/27/2026, 10:31:00 AM\n#   ------------------------------------------------\n#   Tools used: Write, Edit\n#   Files modified: 3\n#     • src/auth.ts\n#     • src/login.ts\n#     • tests/auth.test.ts\n#\n#   I'll help you add user authentication...\n```\n\n### Get JSON output:\n```bash\ncommitledger show-chat abc1234 --json\n```\n\n## 🗂️ Metadata Branch Structure\n\n```\nai/checkpoints/v1/\n├── README.md\n├── checkpoints/          # AI receipts\n│   ├── abc1234...json\n│   └── def5678...json\n└── chat-summaries/       # NEW: Chat summaries\n    ├── abc1234...json\n    └── def5678...json\n```\n\n## 🔍 Chat Summary Format\n\nEach `chat-summaries/<sha>.json` contains:\n\n```json\n{\n  \"version\": \"1.0\",\n  \"commit_sha\": \"abc1234...\",\n  \"session_id\": \"session-xyz\",\n  \"agent_type\": \"claude-code\",\n  \"chat_data\": {\n    \"total_messages\": 15,\n    \"user_prompts\": [\n      {\n        \"timestamp\": \"2026-02-27T10:30:00.000Z\",\n        \"content\": \"Add user authentication\",\n        \"truncated\": false\n      }\n    ],\n    \"assistant_responses\": [\n      {\n        \"timestamp\": \"2026-02-27T10:31:00.000Z\",\n        \"content\": \"I'll help you add authentication...\",\n        \"truncated\": false,\n        \"tool_uses\": [\"Write\", \"Edit\"],\n        \"files_modified\": [\"src/auth.ts\", \"src/login.ts\"]\n      }\n    ]\n  },\n  \"integrity_hash\": \"44d9fc020beac938...\",\n  \"generated_at\": \"2026-02-27T10:32:00.000Z\"\n}\n```\n\n## ✅ Build Status\n\nThe project has been successfully built with all the new features! 🎉\n\nAll chat summaries are stored locally, maintaining commitLedger's local-first philosophy. No data is sent to the cloud.",

          "timestamp": "2026-03-01T11:17:39.530Z",
          "content": "Perfect! I've successfully created a web dashboard for visualizing your commits. Here's what I built:\n\n## 🎨 Features Implemented\n\n### 1. **Dark Theme Dashboard**\n- Beautiful gradient dark background (deep navy blue)\n- Modern glassmorphism design with backdrop blur effects\n- Smooth animations and hover effects\n- Fully responsive layout\n\n### 2. **Repository Commits View**\nEach commit card displays:\n- **Commit SHA** (full hash in monospace font)\n- **GitHub Author** (with user icon)\n- **Timestamp** (localized date/time)\n- **Commit Message** (prominent display)\n- **AI Agent Badge** (Claude Code, Cursor, or Human)\n  - Purple gradient for Claude Code\n  - Blue for Cursor\n  - Gray for Human\n- **Confidence Score** (for AI-detected commits)\n- **Statistics**: Files changed, additions, deletions\n\n### 3. **Dashboard Statistics**\nAt the top, you get overview cards showing:\n- Total Commits\n- AI-Assisted Commits\n- Human-Authored Commits\n- Claude Code Commits\n- Cursor Commits\n\n### 4. **Branch View**\n- Filter by specific branch with `-b` flag\n- Shows current branch by default\n- Displays branch name in the header\n\n## 📝 Usage\n\n### Generate dashboard for current branch:\n```bash\ncommitledger dashboard\n```\n\n### Generate for specific branch:\n```bash\ncommitledger dashboard -b main\n```\n\n### Limit number of commits:\n```bash\ncommitledger dashboard -l 100\n```\n\n### Custom output file:\n```bash\ncommitledger dashboard -o my-dashboard.html\n```\n\n### Generate without auto-opening:\n```bash\ncommitledger dashboard --no-open\n```\n\n## 🎯 Visual Features\n\n- **AI-Assisted Commits**: Have a colorful gradient left border\n- **Color Coding**:\n  - Blue gradients for links and primary actions\n  - Purple for Claude Code\n  - Blue for Cursor  \n  - Green for additions (+)\n  - Red for deletions (-)\n- **Hover Effects**: Cards lift up on hover with enhanced shadows\n- **Icons**: Beautiful SVG icons for users, calendars, and AI\n\nThe dashboard automatically opens in your browser and provides an elegant, professional view of your repository's commit history with AI tracking!",

          "timestamp": "2026-03-01T11:25:13.866Z",
          "content": "Perfect! I've successfully implemented interactive chat history viewing for the dashboard. Here's what's new:\n\n## 🎯 **New Features**\n\n### **1. View Chat History Button**\n- Each commit with AI chat history now has a **\"View Chat History\"** button\n- Only appears for commits that have chat summaries\n- Styled with a subtle blue design matching the AI theme\n- Includes a chat bubble icon\n\n### **2. Beautiful Modal Dialog**\n- **Dark theme** matching the dashboard (pure black background)\n- **Smooth animations** - fades in/out\n- **Scrollable content** with custom dark scrollbar\n- **Backdrop blur** for professional effect\n- **Easy to close**: Click outside, click X, or press Escape\n\n### **3. Chat Display**\n- **User prompts** - Highlighted in blue\n- **Assistant responses** - Highlighted in purple\n- **Chronologically sorted** - Messages appear in order they were sent\n- **Empty messages filtered** - Only shows messages with content\n- **Metadata displayed**:\n  - Timestamp for each message\n  - Tools used by AI (Read, Write, Edit, etc.)\n  - Files modified in each response\n  - Truncation warnings if content was cut off\n\n### **4. Professional Styling**\n- **Clean message cards** with borders\n- **Color-coded roles**:\n  - User messages: Blue (`#60a5fa`)\n  - Assistant messages: Purple (`#a78bfa`)\n- **Monospace timestamps** for technical feel\n- **Proper text escaping** to prevent XSS\n- **Responsive design** adapts to screen size\n\n## 📝 **Usage**\n\n```bash\n# Generate dashboard\ncommitledger dashboard\n\n# Click \"View Chat History\" button on any AI-assisted commit\n# Modal opens with full conversation\n# Close by clicking X, pressing Escape, or clicking outside\n```\n\n## 🎨 **Visual Features**\n\n- Commits with chat history have the \"View Chat History\" button\n- Modal slides in smoothly\n- Messages are easy to read with proper spacing\n- Tool usage and file modifications clearly shown\n- Professional dark theme throughout\n\nT           "timestamp": "2026-03-01T10:56:28.102Z",
          "content": "Perfect! I've successfully implemented AI chat summary storage for commitLedger. Here's what has been added:\n\n## 🎉 New Features\n\n### 1. **Chat Summary Schema** ([src/receipt/chat-summary-schema.ts](src/receipt/chat-summary-schema.ts))\n- Defines the structure for storing AI chat conversations\n- Captures user prompts and assistant responses\n- Includes metadata like timestamps, tool uses, and modified files\n- Content is truncated to 10,000 characters max (with truncation flag)\n- SHA-256 integrity hash for tamper detection\n\n### 2. **Chat Summary Generator** ([src/receipt/chat-summary-generator.ts](src/receipt/chat-summary-generator.ts))\n- Extracts prompts and responses from Claude Code sessions\n- Parses JSONL session files\n- Tracks tool usage (Read, Write, Edit, etc.)\n- Records which files were modified in each response\n- Extensible for Cursor support\n\n### 3. **Storage in Metadata Branch** ([src/git/metadata-branch.ts](src/git/metadata-branch.ts))\n- Added `chat-summaries/` directory alongside `checkpoints/`\n- Chat summaries stored as `chat-summaries/<commit-sha>.json`\n- Methods added:\n  - `storeChatSummary()` - Store chat summary for a commit\n  - `retrieveChatSummary()` - Retrieve chat summary by commit SHA\n  - `chatSummaryExists()` - Check if summary exists\n\n### 4. **Enhanced Capture Command** ([src/cli/commands/capture.ts](src/cli/commands/capture.ts))\n- Automatically generates and stores chat summaries when AI is detected\n- Shows message count: `Chat summary captured (12 messages)`\n- Gracefully handles errors without failing the capture\n\n### 5. **New `show-chat` Command** ([src/cli/commands/show-chat.ts](src/cli/commands/show-chat.ts))\n- Beautiful formatted display of chat conversations\n- Shows user prompts and assistant responses with timestamps\n- Displays tool usage and files modified\n- Supports `--json` flag for programmatic access\n\n## 📝 Usage Examples\n\n### Capture a commit with chat summary:\n```bash\ncommitledger capture HEAD\n# ✓ Receipt captured for abc1234\n# ✓ Chat summary captured (15 messages)\n```\n\n### View the chat summary:\n```bash\ncommitledger show-chat HEAD\n\n# ═════════════════════════════════════════════════\n#          AI CHAT SUMMARY\n# ═════════════════════════════════════════════════\n#\n# 📋 Commit Information\n#   SHA:        abc1234...\n#   Session ID: session-xyz\n#   Agent:      claude-code\n#\n# 📊 Chat Statistics\n#   Total Messages:      15\n#   User Prompts:        8\n#   Assistant Responses: 7\n#\n# 💬 User Prompts\n#   [1] 2/27/2026, 10:30:00 AM\n#   ------------------------------------------------\n#   Add user authentication to the application\n#\n# 🤖 Assistant Responses\n#   [1] 2/27/2026, 10:31:00 AM\n#   ------------------------------------------------\n#   Tools used: Write, Edit\n#   Files modified: 3\n#     • src/auth.ts\n#     • src/login.ts\n#     • tests/auth.test.ts\n#\n#   I'll help you add user authentication...\n```\n\n### Get JSON output:\n```bash\ncommitledger show-chat abc1234 --json\n```\n\n## 🗂️ Metadata Branch Structure\n\n```\nai/checkpoints/v1/\n├── README.md\n├── checkpoints/          # AI receipts\n│   ├── abc1234...json\n│   └── def5678...json\n└── chat-summaries/       # NEW: Chat summaries\n    ├── abc1234...json\n    └── def5678...json\n```\n\n## 🔍 Chat Summary Format\n\nEach `chat-summaries/<sha>.json` contains:\n\n```json\n{\n  \"version\": \"1.0\",\n  \"commit_sha\": \"abc1234...\",\n  \"session_id\": \"session-xyz\",\n  \"agent_type\": \"claude-code\",\n  \"chat_data\": {\n    \"total_messages\": 15,\n    \"user_prompts\": [\n      {\n        \"timestamp\": \"2026-02-27T10:30:00.000Z\",\n        \"content\": \"Add user authentication\",\n        \"truncated\": false\n      }\n    ],\n    \"assistant_responses\": [\n      {\n        \"timestamp\": \"2026-02-27T10:31:00.000Z\",\n        \"content\": \"I'll help you add authentication...\",\n        \"truncated\": false,\n        \"tool_uses\": [\"Write\", \"Edit\"],\n        \"files_modified\": [\"src/auth.ts\", \"src/login.ts\"]\n      }\n    ]\n  },\n  \"integrity_hash\": \"44d9fc020beac938...\",\n  \"generated_at\": \"2026-02-27T10:32:00.000Z\"\n}\n```\n\n## ✅ Build Status\n\nThe project has been successfully built with all the new features! 🎉\n\nAll chat summaries are stored locally, maintaining commitLedger's local-first philosophy. No data is sent to the cloud.",

    function esc(s){
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function formatDate(timestamp){
      const now = new Date();
      const date = new Date(timestamp);
      const diffMs = now - date;
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

      if (diffDays === 0) return 'today';
      if (diffDays === 1) return 'yesterday';
      if (diffDays < 7) return diffDays + 'd ago';
      if (diffDays < 30) return Math.floor(diffDays / 7) + 'w ago';
      if (diffDays < 365) return Math.floor(diffDays / 30) + 'mo ago';
      return Math.floor(diffDays / 365) + 'y ago';
    }

    function row(commit){
      const agentClass = commit.aiAgent ? commit.aiAgent : 'human';
      const agentLabel = commit.aiAgent === 'claude-code' ? 'Claude Code' :
                         commit.aiAgent === 'cursor' ? 'Cursor' : 'Human';
      const confidenceText = commit.confidence ? ` ${(commit.confidence * 100).toFixed(0)}%` : '';

      // Format tokens display
      let tokensDisplay = 'N/A';
      if (commit.tokens) {
        if (commit.tokens < 1000) {
          tokensDisplay = `${commit.tokens} tokens`;
        } else {
          tokensDisplay = `${(commit.tokens / 1000).toFixed(1)}k tokens`;
        }
      }

      return `
        <div class="row">
          <div>
            <div class="title">${esc(commit.message)}</div>
            <div class="meta">
              <span class="hash">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M9 7a4 4 0 1 0 0 8h6a4 4 0 1 0 0-8H9Z" stroke="rgba(215,222,232,.55)" stroke-width="2"/>
                </svg>
                ${esc(commit.shortSha)}
              </span>
              <span class="dot">•</span>
              <span>${formatDate(commit.timestamp)}</span>
              <span class="dot">•</span>
              <span>${esc(commit.author)}</span>
              <span class="chip ${agentClass}">
                <span class="b"></span>${agentLabel}${confidenceText}
              </span>
            </div>
            ${commit.hasChatSummary ? `
              <button class="view-chat-btn" onclick="openChatModal('${commit.sha}')">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                  <path fill-rule="evenodd" d="M4.848 2.771A49.144 49.144 0 0112 2.25c2.43 0 4.817.178 7.152.52 1.978.292 3.348 2.024 3.348 3.97v6.02c0 1.946-1.37 3.678-3.348 3.97a48.901 48.901 0 01-3.476.383.39.39 0 00-.297.17l-2.755 4.133a.75.75 0 01-1.248 0l-2.755-4.133a.39.39 0 00-.297-.17 48.9 48.9 0 01-3.476-.384c-1.978-.29-3.348-2.024-3.348-3.97V6.741c0-1.946 1.37-3.678 3.348-3.97z" clip-rule="evenodd" />
                </svg>
                View Chat
              </button>
            ` : ''}
          </div>

          <div class="rstats">
            <div class="diff">
              <span class="plus">+${commit.insertions}</span>
              <span class="minus">-${commit.deletions}</span>
              <span class="files">${commit.filesChanged} file${commit.filesChanged !== 1 ? 's' : ''}</span>
            </div>
            <div class="sub">
              <span>${commit.sessions} session${commit.sessions !== 1 ? 's' : ''}</span>
              <span class="sep">·</span>
              <span>${tokensDisplay}</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderStats(){
      const totalCommits = commits.length;
      const humanCommits = commits.filter(c => !c.aiAgent).length;
      const claudeCommits = commits.filter(c => c.aiAgent === 'claude-code').length;
      const cursorCommits = commits.filter(c => c.aiAgent === 'cursor').length;

      const statsGrid = document.getElementById('stats-grid');
      statsGrid.innerHTML = `
        <div class="card">
          <div class="card-inner">
            <div class="kicker">Total Commits</div>
            <div class="big">${totalCommits}</div>
            <div class="small">All commits analyzed</div>
          </div>
        </div>
        <div class="card">
          <div class="card-inner">
            <div class="kicker">Human Commits</div>
            <div class="big">${humanCommits}</div>
            <div class="small">Manually authored</div>
          </div>
        </div>
        <div class="card">
          <div class="card-inner">
            <div class="kicker">Claude Commits</div>
            <div class="big">${claudeCommits}</div>
            <div class="small">Claude Code assisted</div>
          </div>
        </div>
        <div class="card">
          <div class="card-inner">
            <div class="kicker">Cursor Commits</div>
            <div class="big">${cursorCommits}</div>
            <div class="small">Cursor AI assisted</div>
          </div>
        </div>
      `;
    }

    function render(){
      const list = document.getElementById('list');
      list.innerHTML = commits.map(row).join('');
    }

    renderStats();
    render();

    // Modal functions
    function openChatModal(sha) {
      const modal = document.getElementById('chatModal');
      const modalTitle = document.getElementById('modalTitle');
      const modalBody = document.getElementById('modalBody');

      const commit = commits.find(c => c.sha === sha);
      const chatSummary = chatSummaries[sha];

      if (!chatSummary) {
        modalBody.innerHTML = '<div class="error">No chat history available</div>';
        return;
      }

      modalTitle.textContent = `AI Chat History - ${commit.shortSha}`;
      modalBody.innerHTML = renderChatSummary(chatSummary);
      modal.classList.add('active');
    }

    function closeModal() {
      const modal = document.getElementById('chatModal');
      modal.classList.remove('active');
    }

    function renderChatSummary(summary) {
      const { chat_data } = summary;

      // Filter out empty messages
      const validUserPrompts = chat_data.user_prompts.filter(p => p.content && p.content.trim());
      const validAssistantResponses = chat_data.assistant_responses.filter(r => r.content && r.content.trim());

      // Combine and sort messages by timestamp
      const allMessages = [
        ...validUserPrompts.map(p => ({ ...p, role: 'user' })),
        ...validAssistantResponses.map(r => ({ ...r, role: 'assistant' }))
      ].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

      if (allMessages.length === 0) {
        return '<div class="error">No chat messages available</div>';
      }

      let html = '';

      allMessages.forEach(msg => {
        const time = new Date(msg.timestamp).toLocaleString();
        const roleClass = msg.role === 'user' ? 'user' : 'assistant';
        const roleLabel = msg.role === 'user' ? 'User' : 'Assistant';

        html += `
          <div class="message">
            <div class="message-header">
              <div class="message-role ${roleClass}">${roleLabel}</div>
              <div class="message-time">${time}</div>
            </div>
            <div class="message-content">${escapeHtml(msg.content)}</div>
            ${msg.tool_uses && msg.tool_uses.length > 0 ? `
              <div class="message-meta">
                <div class="message-meta-item"><strong>Tools used:</strong> ${msg.tool_uses.join(', ')}</div>
              </div>
            ` : ''}
            ${msg.files_modified && msg.files_modified.length > 0 ? `
              <div class="message-meta">
                <div class="message-meta-item"><strong>Files modified:</strong> ${msg.files_modified.length}</div>
                ${msg.files_modified.slice(0, 3).map(f => `<div class="message-meta-item">  • ${f}</div>`).join('')}
                ${msg.files_modified.length > 3 ? `<div class="message-meta-item">  ... and ${msg.files_modified.length - 3} more</div>` : ''}
              </div>
            ` : ''}
            ${msg.truncated ? '<div class="message-meta"><em>Content truncated</em></div>' : ''}
          </div>
        `;
      });

      return html;
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Close modal when clicking outside
    document.getElementById('chatModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeModal();
      }
    });

    // Close modal on Escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeModal();
      }
    });
  </script>
